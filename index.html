<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Carta para ti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Karla:wght@500;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&display=swap">
  <link rel="stylesheet" href="style.css"></head>
<body>
  <main class="sheet">
    <header class="head">
      <h1>Para ti,</h1>
    </header>

    <article class="letter">
     
    </article>

    <section class="reply" aria-labelledby="titulo-respuesta">
      <h2 id="titulo-respuesta">Tu respuesta</h2>
      <p class="hint">Escribe aquí lo que quieras responder.</p>

      <label class="sr-only" for="mensaje">Tu respuesta</label>
      <textarea id="mensaje" rows="6" placeholder="Escribe tu respuesta…"></textarea>
      <p id="vacio" class="error" hidden>Escribe algo antes de guardar.</p>

      <div class="actions">
        <button type="button" id="guardar" class="btn">Guardar respuesta</button>
      </div>
      <p id="estado" class="note" role="status"></p>

      <div id="vista" class="saved" hidden>
        <p class="saved-label">Respuesta guardada</p>
        <p id="vista-texto" class="saved-text"></p>
        <p id="vista-fecha" class="saved-date"></p>
        <button type="button" id="editar" class="btn btn-quiet">Editar</button>
      </div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
